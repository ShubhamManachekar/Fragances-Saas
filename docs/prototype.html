<title>Client Studio Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE work: a fragrance-oil house showing its client brands what the market uses
   IDEA a perfumer's order book: ivory paper, burgundy ink, gold rules
   PICTURE "Most-used oils" ranked bars on the Market page; upload desk on Home
   COLOUR ivory ground, burgundy lead, antique gold support; muted family tints; dark = wine-black
   TYPE Cormorant Garamond headings + Jost body (from CLAUDE.md)
   LAYOUT laptop: left sidebar + content; phone: top bar + bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#faf7f0,#171012);--surface:light-dark(#ffffff,#211719);--sunk:light-dark(#f3eee4,#1c1315);--ink:light-dark(#2a1a1c,#f3ece2);--muted:light-dark(#6f5d5f,#b6a6a1);--line:light-dark(#e7dfd2,#372a2c);--wine:light-dark(#7a1f2b,#d97a86);--wine-ink:light-dark(#ffffff,#1a1012);--wine-soft:light-dark(#f7eaea,#3a2226);--gold:light-dark(#94742c,#d3b26a);--gold-soft:light-dark(#f4ecd7,#352c1d);--ok:light-dark(#2f6b45,#7cc596);--dot:light-dark(#dccfba,#4a3a3c);--base:light-dark(#5c4a46,#a8968f);
--holo-bg:light-dark(#1d1416,#120c0e);--holo-ink:#efe4cf;--holo-gold:#cfb06b;--holo-wine:#de8b97;--f-fresh:light-dark(#6f8a52,#9fbb82);--f-floral:light-dark(#9c3445,#e08a97);--f-woody:light-dark(#6b5444,#b59a86);--f-oriental:light-dark(#a86a26,#dba15f);--f-aromatic:light-dark(#66618f,#a9a3d6);--f-gourmand:light-dark(#b8954a,#e0c27e);--f-herbal:light-dark(#46685a,#8fb8a6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Jost,system-ui,sans-serif;margin:0;overflow-x:clip}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}

p{margin:.25em 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:700;color:var(--wine);padding:0 8px}
.brand small{display:block;font:500 13px Jost,sans-serif;color:var(--muted)}
.who{display:grid;gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
.who button{border:0;background:none;min-height:44px;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;padding:0 12px;line-height:1.2}
.who button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.nav{display:grid;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;border:0;background:none;min-height:52px;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left;line-height:1.3}
.nav button svg{flex:none;color:var(--muted)}
.nav button[aria-current=page]{background:var(--wine-soft);color:var(--wine);font-weight:500}
.nav button[aria-current=page] svg{color:var(--wine)}
.nav .count{margin-left:auto;background:var(--wine);color:var(--wine-ink);border-radius:999px;font-size:13px;padding:0 8px}
.foot{margin-top:auto;font-size:13px;color:var(--muted);padding:0 8px}
main{padding:32px max(4vw,16px) 72px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;margin-bottom:24px}
.lead{color:var(--muted);max-width:66ch;margin-top:6px}
.grid{display:grid;gap:20px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.grid2{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.stack{display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h2{margin-bottom:4px}
.sub{font-size:14px;color:var(--muted);font-weight:400}

.btn.quiet{background:none;border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--wine);text-decoration:underline;cursor:pointer;padding:0;min-height:44px}
.steps{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap;padding:0}
.steps li{list-style:none;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.steps li b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-weight:500}
.steps li.on{color:var(--ink)}.steps li.on b{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}

.steps li+li::before{content:"";width:24px;height:1px;background:var(--line);margin-right:4px}

.msg{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}

.tick{color:var(--ok);font-weight:600}.cross{color:var(--wine);font-weight:600}
.scroll{overflow-x:auto}

.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));margin-bottom:20px}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:4px;gap:2px}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.fdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.oilrow{display:grid;grid-template-columns:minmax(10em,15em) minmax(0,1fr) 4.2em;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.oilrow:last-child{border-bottom:0}
.oilrow .t{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}.oilrow .t b{display:block;height:100%;border-radius:7px}
.oilrow .hid{font-size:13px;color:var(--muted);font-style:italic}
.code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fambar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--sunk)}

.feat{border-top:3px solid var(--gold)}
.chart{position:relative;height:240px;margin-top:8px}.chart svg{position:absolute;inset:0;width:100%;height:100%}
.slider{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--wine);min-height:44px}
.now{background:var(--sunk);border-radius:10px;padding:14px 16px;margin-top:8px;font-size:17px}
.phases{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}
.phase{border:1px solid var(--line);border-radius:12px;padding:14px;transition:border-color .2s,background .2s}
.phase.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.phase h3{display:flex;gap:8px;align-items:center;font-size:19px}.phase h3 i{width:12px;height:12px;border-radius:3px;background:var(--c)}

.note{padding:7px 0;border-top:1px solid var(--line)}.note b{font-weight:500;display:block}.note span{font-size:14px;color:var(--muted)}
.form label{display:block;margin-bottom:14px;font-size:15px;color:var(--muted)}
.field{display:block;width:100%;margin-top:6px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 12px;font-size:16px;color:var(--ink)}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}.switch input{width:20px;height:20px;accent-color:var(--wine);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:9;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer;min-height:36px}
.empty{color:var(--muted);text-align:center;padding:24px;display:block!important}
.fmt td,.fmt th{white-space:normal}
.hg-bg{fill:var(--holo-bg)}
.hg-grid{stroke:var(--holo-gold);stroke-opacity:.14;stroke-width:1}.hg-eq{stroke-opacity:.3;stroke-dasharray:2 4}
.hg-tiny,.hg-name,.hg-val{paint-order:stroke;stroke:var(--holo-bg);stroke-width:4px;stroke-linejoin:round}
.hg-tiny{fill:var(--holo-gold);fill-opacity:.85;font-size:11px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.hg-land{fill:var(--holo-gold);fill-opacity:.75}.hg-dim{fill-opacity:.45}
.hg-route{fill:none;stroke:var(--holo-ink);stroke-opacity:.75;stroke-width:1.3;stroke-dasharray:3 6;animation:hgflow 2.4s linear infinite}
.hg-plant{fill:var(--holo-bg);stroke:var(--holo-ink);stroke-width:1.5}
.hg-ring{fill:var(--holo-wine);fill-opacity:.12;stroke:var(--holo-wine);stroke-width:1.4}
.hg-ping{fill:none;stroke:var(--holo-wine);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:hgping 3.2s ease-out infinite;opacity:0}
.hg-tick{stroke:var(--holo-ink);stroke-opacity:.6;stroke-width:1}
.hg-arc{fill:none;stroke:var(--holo-gold);stroke-width:3;stroke-linecap:round}
.hg-core{fill:var(--holo-ink)}
.hg-lead{fill:none;stroke:var(--holo-ink);stroke-opacity:.5;stroke-width:1}
.hg-name{fill:var(--holo-ink);font-size:13px;font-weight:500}
.hg-val{fill:var(--holo-gold);font-size:12px;font-variant-numeric:tabular-nums}
.hg-frame{fill:none;stroke:var(--holo-gold);stroke-opacity:.6;stroke-width:1.2}
.hg-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:10px}
.hg-legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px}
.lg-ring{border:1.4px solid var(--wine);border-radius:50%}.lg-arc{border:3px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold);border-radius:50%}.lg-route{border-top:1.5px dashed var(--ink);height:0!important;vertical-align:3px!important}
@keyframes hgflow{to{stroke-dashoffset:-18}}
@keyframes hgping{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}}

.gw{--g-tx:var(--ink);--g-mu:var(--muted);--g-bg:var(--surface);position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}

.hm-grid{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(260px,1fr);gap:20px;align-items:start}

/* Privacy rule shown in the UI: a figure is hidden when only one other brand is behind it. */
function oilStats(products,period,cat){
  const rows=products.filter(p=>(cat==='All'||p.cat===cat)&&p.units[period]>0);const by={};
  rows.forEach(p=>{const o=by[p.oil]||(by[p.oil]={code:p.oil,units:0,brands:new Set()});o.units+=p.units[period];o.brands.add(p.brand)});
  const all=Object.values(by).map(o=>({...o,mine:o.brands.has(ME),hidden:o.brands.size<2&&!o.brands.has(ME)}));
  const tot=all.filter(o=>!o.hidden).reduce((s,o)=>s+o.units,0)||1;
  /* shares are worked out among visible oils only, so hidden volumes cannot be back-calculated; hidden oils go last */
  return all.map(o=>({...o,share:o.hidden?0:o.units/tot})).sort((a,b)=>(a.hidden-b.hidden)||(b.units-a.units));
}
function rising(products,cat){
  const a=Object.fromEntries(oilStats(products,PREV,cat).map(o=>[o.code,o.share]));
  return oilStats(products,CUR,cat).filter(o=>!o.hidden&&o.brands.size>=2).map(o=>({...o,delta:o.share-(a[o.code]||0)})).filter(o=>o.delta>0.001).sort((x,y)=>y.delta-x.delta).slice(0,3);
}
function gaps(products,feat){
  const mine=products.filter(p=>p.brand===ME);const out=[];
  [...new Set(mine.map(p=>p.cat))].forEach(cat=>{const used=new Set(mine.filter(p=>p.cat===cat).map(p=>p.oil));
    oilStats(products,CUR,cat).filter(o=>!o.hidden&&o.brands.size>=2&&!used.has(o.code)).slice(0,2).forEach(o=>out.push({code:o.code,why:`${pct(o.share)} of shared ${cat.toLowerCase()} volume, used by ${o.brands.size} brands`,cat}))});
  const all=new Set(mine.map(p=>p.oil));Object.entries(feat).forEach(([c,tag])=>{if(!all.has(c)&&!out.some(g=>g.code===c))out.push({code:c,why:tag==='New inspiration'?'New from our perfumers':'Ready stock, available now',cat:null,tag})});
  return out;
}
function families(products,cat,who){
  const rows=products.filter(p=>(cat==='All'||p.cat===cat)&&(!who||p.brand===who)&&p.units[CUR]>0);const f={};
  rows.forEach(p=>{const k=OILS[p.oil].fam,o=f[k]||(f[k]={u:0,b:new Set()});o.u+=p.units[CUR];o.b.add(p.brand)});
  const vis=Object.entries(f).filter(([,o])=>who||o.b.size>=2||o.b.has(ME));const tot=vis.reduce((s,[,o])=>s+o.u,0)||1;
  return vis.map(([k,o])=>[k,o.u/tot]).sort((a,b)=>b[1]-a[1]);
}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
function checkRow(r,map,n){const g=k=>(r[map[k]]||'').trim();const e=[];
  if(!g('product'))e.push('product name is empty');
  if(!CATS.includes(g('cat')))e.push(`category "${g('cat')}" is not one of: ${CATS.join(', ')}`);
  if(!OILS[g('oil').toUpperCase()])e.push(`oil code ${g('oil')||'(empty)'} is not in our catalog`);
  if(!REGIONS[g('market')])e.push(`market "${g('market')}" is not recognised`);
  if(!PERIODS.includes(g('period')))e.push(`period "${g('period')}" should be ${PERIODS.join(' or ')}`);
  const u=parseFloat(g('units').replace(/,/g,''));if(!(u>=0))e.push('units sold is not a number');
  return e.length?{n,e}:null}

const PLANT={name:'Our plant (sample)',lat:19,lon:73};
const LBL={'United Kingdom':'nw','Europe':'ne','GCC':'sw','India':'se','Southeast Asia':'e','North America':'n'};
const SHORT={'United Kingdom':'UK','Southeast Asia':'SE Asia','North America':'N. America'};
function WorldMap({byReg,mapStyle}){
  const[ref,{w:W,h:H}]=useSize();const holo=mapStyle==='Hologram';let body=null;
  if(W&&Object.keys(byReg).length){
    const pad=holo?{x:18,y:24}:{x:0,y:0};const k=Math.min((W-2*pad.x)/360,(H-2*pad.y)/136),ox=(W-360*k)/2,oy=(H-136*k)/2,X=lo=>ox+(lo+180)*k,Y=la=>oy+(80-la)*k;
    const tot=Object.values(byReg).reduce((s,v)=>s+v,0),mx=Math.max(...Object.values(byReg)),r0=Math.max(12,k*15),dr=Math.max(1,k*.75);
    const pts=Object.entries(byReg).map(([nm,v])=>{const[la,lo]=REGIONS[nm];return{nm,v,share:v/tot,x:X(lo),y:Y(la),r:Math.max(6,Math.sqrt(v/mx)*r0)}});

        ${pts.map(({nm:n,v,x,y,r})=>{const d=LBL[n];const[a,tx,ty]=d==='nw'?['end',x-r*.6,y-r-4]:d==='sw'?['end',x-r-5,y+4]:d==='se'?['start',x+r+5,y+8]:d==='e'?['start',x+r+5,y+4]:d==='ne'?['start',x+r*.7+3,y-r*.7-3]:['middle',x,y-r-6];
          return html`<text key=${'t'+n} x=${tx} y=${ty} textAnchor=${a} fontSize="13" fill="var(--ink)" style=${{paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'}}>${nm(n)} ${fmt(v/1000)}k</text>`})}</svg>`;
    }else{
      /* zoom to the client's markets plus our plant, keeping the box's shape */
      const lons=[...Object.keys(byReg).map(n=>REGIONS[n][1]),PLANT.lon],lats=[...Object.keys(byReg).map(n=>REGIONS[n][0]),PLANT.lat];
      let lo0=Math.min(...lons)-22,lo1=Math.max(...lons)+22,la0=Math.min(...lats)-16,la1=Math.max(...lats)+16;
      if(lo1-lo0<90){const c=(lo0+lo1)/2;lo0=c-45;lo1=c+45}if(la1-la0<45){const c=(la0+la1)/2;la0=c-22.5;la1=c+22.5}
      const iw=W-2*pad.x,ih=H-2*pad.y;const kz=Math.min(iw/(lo1-lo0),ih/(la1-la0));const cLo=(lo0+lo1)/2,cLa=(la0+la1)/2;
      const ZX=lo=>W/2+(lo-cLo)*kz,ZY=la=>H/2-(la-cLa)*kz;
      const vLo0=cLo-W/2/kz,vLo1=cLo+W/2/kz,vLa0=cLa-H/2/kz,vLa1=cLa+H/2/kz;
      const zr0=Math.max(12,Math.min(kz*7,44));
      pts.forEach(p=>{const[la,lo]=REGIONS[p.nm];p.x=ZX(lo);p.y=ZY(la);p.r=Math.max(7,Math.sqrt(p.v/mx)*zr0)});
      const px=ZX(PLANT.lon),py=ZY(PLANT.lat);
      const step=kz>4?15:30,gl=v=>Math.ceil(v/step)*step;
      const ZD=kz>3?DOTS2:DOTS,zdr=Math.max(1.1,Math.min(kz*(ZD===DOTS2?.26:.45),2.2));
      const grat=[];for(let lo=gl(vLo0);lo<=vLo1;lo+=step)grat.push(html`<line key=${'lo'+lo} x1=${ZX(lo)} x2=${ZX(lo)} y1=${0} y2=${H} className="hg-grid"/>`);
      for(let la=gl(vLa0);la<=vLa1;la+=step)grat.push(html`<line key=${'la'+la} x1=${0} x2=${W} y1=${ZY(la)} y2=${ZY(la)} className=${la===0?'hg-grid hg-eq':'hg-grid'}/>`);
      const latLbl=[];for(let la=gl(vLa0);la<=vLa1;la+=step){const y=ZY(la);if(y>34&&y<H-14)latLbl.push(html`<text key=${'ll'+la} x=${14} y=${y-4} className="hg-tiny">${la===0?'0°':Math.abs(la)+'°'+(la>0?'N':'S')}</text>`)}
      for(let lo=gl(vLo0);lo<=vLo1;lo+=step){const x=ZX(lo);if(x>40&&x<W-40)latLbl.push(html`<text key=${'lb'+lo} x=${x+4} y=${H-12} className="hg-tiny">${Math.abs(lo)+'°'+(lo>=0?'E':'W')}</text>`)}
      const land=ZD.filter(([lo,la])=>lo>=vLo0-2&&lo<=vLo1+2&&la>=vLa0-2&&la<=vLa1+2);
      const arc=(x,y,r,f)=>{const a=Math.min(f,.999)*2*Math.PI,ex=x+r*Math.sin(a),ey=y-r*Math.cos(a);return`M${x},${y-r}A${r},${r} 0 ${a>Math.PI?1:0} 1 ${ex},${ey}`};
      const route=(x,y)=>{const mxp=(px+x)/2,myp=(py+y)/2-Math.hypot(x-px,y-py)*.28;return`M${px},${py}Q${mxp},${myp} ${x},${y}`};
      const callout=({nm:n,v,share,x,y,r})=>{const d=LBL[n]||'n';const dx=/e/.test(d)?1:/w/.test(d)?-1:0,dy=/n/.test(d)?-1:/s/.test(d)?1:-1;
        const ex=x+dx*(r+6),ey=y+dy*(r+6)*.7,lx=ex+dx*(W<560?10:22);let anchor=dx<0?'end':dx>0?'start':'middle',tx=dx===0?ex:lx+dx*4;const tw=Math.max(nm(n).length*7.5,70);if(anchor==='start'&&tx+tw>W-12){anchor='end';tx=W-12}if(anchor==='end'&&tx-tw<12){anchor='start';tx=12}
        return html`<g key=${'c'+n}><polyline points=${`${x+dx*r*.7},${y+dy*r*.7} ${ex},${ey} ${dx===0?ex:lx},${ey}`} className="hg-lead"/>
          <text x=${tx} y=${ey-(dx===0?14:3)} textAnchor=${anchor} className="hg-name">${nm(n)}</text>
          <text x=${tx} y=${ey+(dx===0?-1:12)} textAnchor=${anchor} className="hg-val">${fmt(v/1000)}k · ${pct(share)}</text></g>`};
      const br=(x,y,sx,sy)=>html`<path d=${`M${x},${y+sy*14}V${y}H${x+sx*14}`} className="hg-frame"/>`;
      body=html`<svg viewBox=${`0 0 ${W} ${H}`} className="hg">
        <rect x="0" y="0" width=${W} height=${H} rx="10" className="hg-bg"/>
        ${grat}${latLbl}
        ${land.map(([lo,la],i)=>html`<circle key=${i} cx=${ZX(lo)} cy=${ZY(la)} r=${zdr} className=${(Math.round((80-la)/(ZD===DOTS2?1.5:3))%2)?'hg-land hg-dim':'hg-land'}/>`)}
        ${pts.filter(p=>Math.hypot(p.x-px,p.y-py)>p.r+6).map(p=>html`<path key=${'r'+p.nm} d=${route(p.x,p.y)} className="hg-route"/>`)}
        <g><rect x=${px-5} y=${py-5} width="10" height="10" transform=${`rotate(45 ${px} ${py})`} className="hg-plant"/><text x=${px} y=${py+20} textAnchor="middle" className="hg-tiny">Our plant</text></g>
        ${pts.map((p,i)=>html`<g key=${p.nm}>
          <circle cx=${p.x} cy=${p.y} r=${p.r} className="hg-ping" style=${{animationDelay:i*.5+'s'}}/>
          <circle cx=${p.x} cy=${p.y} r=${p.r} className="hg-ring"/>
          ${[0,1,2,3].map(t=>{const a=t*Math.PI/2;return html`<line key=${t} x1=${p.x+(p.r+2)*Math.sin(a)} y1=${p.y-(p.r+2)*Math.cos(a)} x2=${p.x+(p.r+6)*Math.sin(a)} y2=${p.y-(p.r+6)*Math.cos(a)} className="hg-tick"/>`})}
          <path d=${arc(p.x,p.y,p.r*.62,p.share)} className="hg-arc"/>
          <circle cx=${p.x} cy=${p.y} r="2.4" className="hg-core"/></g>`)}
        ${pts.map(callout)}
        ${br(8,8,1,1)}${br(W-8,8,-1,1)}${br(8,H-8,1,-1)}${br(W-8,H-8,-1,-1)}
        <rect x=${W-250} y="10" width="236" height="22" rx="4" className="hg-bg"/><text x=${W-16} y="25" textAnchor="end" className="hg-tiny">${CUR} · ${fmt(tot)} units · ${pts.length} markets</text></svg>`;
    }
  }
  return html`<div className="fig" ref=${ref} role="img" aria-label=${'World map of your units sold by market: '+Object.entries(byReg).map(([n,v])=>n+' '+fmt(v)).join(', ')}>${body}</div>
    ${holo&&html`<div className="hg-legend"><span><i className="lg-ring"></i>Ring size: units sold</span><span><i className="lg-arc"></i>Gold arc: share of your total</span><span><i className="lg-route"></i>Supply route from our plant (sample)</span></div>`}`;
}

/* ================= client: our oils (scent over time) ================= */
const PH=[['top','Top notes','First impression','0 – 30 min','var(--gold)'],['heart','Heart notes','The main character','30 min – 4 h','var(--wine)'],['base','Base notes','What stays','4 h and longer','var(--base)']];
const curve={top:t=>Math.exp(-t/.4),heart:t=>{const p=1.3;return Math.pow(t/p,1.6)*Math.exp(1.6*(1-t/p))},base:t=>.85*(1-Math.exp(-t/1.6))*Math.exp(-t/30)};
const TMAX=8,TT=[0,.25,.5,1,2,4,6,8],tl=t=>t===0?'Use':t<1?Math.round(t*60)+' min':t+' h';
function ScentChart({name,t}){
  const[ref,{w:W,h:H}]=useSize();let body=null;
  if(W){const m={l:8,r:8,t:30,b:30},X=v=>m.l+Math.sqrt(v/TMAX)*(W-m.l-m.r),Y=v=>H-m.b-v*(H-m.t-m.b);
    const path=f=>{let d=`M${X(0)},${Y(0)}`;for(let i=0;i<=120;i++){const v=TMAX*(i/120)**2;d+=`L${X(v)},${Y(Math.min(1,f(v)))}`}return d+`L${X(TMAX)},${Y(0)}Z`};
    const lab={paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'};
    body=html`<svg viewBox=${`0 0 ${W} ${H}`}>${TT.map(v=>html`<g key=${v}><line x1=${X(v)} x2=${X(v)} y1=${m.t} y2=${H-m.b} stroke="var(--line)"/><text x=${X(v)} y=${H-8} fontSize="13" fill="var(--muted)" textAnchor=${v===0?'start':v===TMAX?'end':'middle'}>${W<480&&(v===.25||v===6)?'':tl(v)}</text></g>`)}
      ${PH.map(([k,,,,c])=>html`<path key=${k} d=${path(curve[k])} fill=${c} fillOpacity=".2" stroke=${c} strokeWidth="2"/>`)}
      <text x=${X(.02)+6} y=${Y(1)-10} fontSize="14" fontWeight="500" fill="var(--gold)" style=${lab}>${W<520?'Top':'Top notes'}</text>
      <text x=${X(1.3)} y=${Y(1)-10} fontSize="14" fontWeight="500" fill="var(--wine)" textAnchor="middle" style=${lab}>${W<520?'Heart':'Heart notes'}</text>
      <text x=${X(TMAX)-6} y=${Y(curve.base(TMAX))-10} fontSize="14" fontWeight="500" fill="var(--base)" textAnchor="end" style=${lab}>${W<520?'Base':'Base notes'}</text>
      <line x1=${X(t)} x2=${X(t)} y1=${m.t-14} y2=${H-m.b} stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="4 3"/></svg>`}
  return html`<div className="chart" ref=${ref} role="img" aria-label=${'How '+name+' smells over time: top notes fade within about 30 minutes, heart notes lead for a few hours, base notes last longest.'}>${body}</div>`;
}

/* ---- olfactory graph (SVG) ---- */

  const start=nn?pref(order[0]):0,pp=order.map((e,k)=>{const a=start+k*2*Math.PI/Math.max(nn,1);return{a,x:cx+rp*Math.cos(a),y:cx+rp*Math.sin(a)}});

  order.forEach(e=>e.notes.forEach(([n,w])=>{used[n]=(used[n]||0)+w*ws(e);fs[NF[n]]+=w*ws(e);(np[n]=np[n]||[]).push(e.id)}));
  const ns=new Set(),ps=new Set();
  if(act&&act.k==='n'){ns.add(act.id);(np[act.id]||[]).forEach(x=>ps.add(x))}
  if(act&&act.k==='p'){ps.add(act.id);order.find(e=>e.id===act.id).notes.forEach(([n])=>ns.add(n))}
  if(act&&act.k==='f'){GNOTES.forEach(n=>{if(NF[n]===act.id){ns.add(n);(np[n]||[]).forEach(x=>ps.add(x))}})}

  if(act&&act.k==='n'){const u=[...ps].map(x=>byId[x].label);info=`${act.id} (${GF[NF[act.id]].toLowerCase()} family). ${u.length?'Used by '+u.join(', ')+'.':'Not used yet: a gap you could fill.'}`}

  if(act&&act.k==='f'){const inFam=GNOTES.filter(n=>NF[n]===act.id);info=`${GF[act.id]}: ${inFam.filter(n=>np[n]).length} of ${inFam.length} notes in use.`}
  const ev=(k,id)=>({onMouseEnter:()=>setHov({k,id}),onMouseLeave:()=>setHov(null),onClick:()=>setSel(sel&&sel.k===k&&sel.id===id?null:{k,id})});

function Graphs({products,role,go}){
  const staff=role==='staff';const[sty,setSty]=useState('Hologram'),[gr,setGr]=useState('All');
  const live=(staff?products:products.filter(p=>p.brand===ME)).filter(p=>(p.units[CUR]||0)>0);
  /* map nodes: one per market */
  const mk={};live.forEach(p=>{const u=p.units[CUR],r=famRow(p),o=mk[p.market]||(mk[p.market]={m:p.market,tot:0,row:Array(7).fill(0),prods:[]});o.tot+=u;r.forEach((v,i)=>o.row[i]+=v*u);o.prods.push(p)});

  const[sel,setSel]=useState(null);const cur=nodes.find(n=>n.m===sel)||nodes[0];

  const en=staff?Object.keys(BRANDS).map((b,i)=>{const ps=live.filter(p=>p.brand===b),tot=ps.reduce((s,p)=>s+p.units[CUR],0),agg={},byMkt={};
      ps.forEach(p=>{byMkt[p.market]=(byMkt[p.market]||0)+p.units[CUR];notesOf(p).forEach(([n,w])=>agg[n]=(agg[n]||0)+w*p.units[CUR]/tot)});
      return{id:b,label:BRANDS[b].split(' ')[0],color:GCOLS[i%4],tot,byMkt,notes:Object.entries(agg),detail:`${ps.length} products using ${new Set(ps.map(p=>p.oil)).size} of our oils.`}}).filter(e=>e.tot>0)
    :live.map(p=>{const o=OILS[p.oil];return{id:p.name,label:p.name.replace(/^Aurel /,''),color:GCOLS[0],tot:p.units[CUR],byMkt:{[p.market]:p.units[CUR]},notes:notesOf(p),detail:`${p.name} uses ${o.name} (${p.oil}). Top: ${o.top.map(x=>x[0]).join(', ')}. Heart: ${o.heart.map(x=>x[0]).join(', ')}. Base: ${o.base.map(x=>x[0]).join(', ')}.`}});
  const lead=nodes.length?GF[nodes.reduce((a,n)=>a.map((v,i)=>v+n.row[i]),Array(7).fill(0)).reduce((b,v,i,arr)=>v>arr[b]?i:b,0)]:'—';
  const FC=GPAL[sty];
  return html`<div className="head"><div><h1>${staff?'Where every brand sells, and what is inside':'Where your fragrances sell, and what is inside them'}</h1><p className="lead">The map shows each market, coloured by the scent family that sells most there. The graph below shows which notes your ${staff?'clients\' products':'products'} are built from. Sample data.</p></div>
    <${Seg} value=${sty} set=${setSty} opts=${['Hologram','Classic']} label="Style for map and graph"/></div>
  <div className="kpis"><div className="card"><div className="sub">Units, ${CUR}</div><div className="big">${fmt(live.reduce((s,p)=>s+p.units[CUR],0)/1000)}k</div></div><div className="card"><div className="sub">Markets</div><div className="big">${nodes.length}</div></div><div className="card"><div className="sub">Leading family</div><div className="big">${lead}</div></div></div>
  <h2 style=${{margin:'8px 0 10px'}}>Market map</h2>
  <div className="hm-grid"><${HoloMap} nodes=${nodes} sty=${sty} sel=${cur&&cur.m} setSel=${setSel}/>
    <section className="card hm-side">${cur?html`<p className="sub">Selected market</p><h3 style=${{fontSize:'26px'}}>${cur.m}</h3>
      <p style=${{marginTop:'6px'}}><b style=${{fontWeight:500}}>${fmt(cur.tot)}</b> units, led by <b style=${{fontWeight:500}}>${GF[cur.row.indexOf(Math.max(...cur.row))]}</b>.</p>
      <h3 style=${{marginTop:'14px',fontSize:'18px'}}>Scent family mix</h3>
      ${cur.row.map((v,i)=>[i,v/cur.rsum]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(([i,q])=>html`<div key=${i} className="hm-mb"><span>${GF[i]}</span><div className="t"><b style=${{width:Math.min(100,q*200)+'%',background:FC[i]}}></b></div><span className="num">${pct(q)}</span></div>`)}
      <h3 style=${{marginTop:'14px',fontSize:'18px'}}>${staff?'Products sold here':'Your products here'}</h3>
      <ul className="list">${cur.prods.map(p=>html`<li key=${p.brand+p.name} style=${{padding:'8px 0'}}><span>${p.name}${staff?html`<br/><span className="sub">${BRANDS[p.brand]}</span>`:''}</span><span className="num sub">${fmt(p.units[CUR])}</span></li>`)}</ul>
      <button className="btn quiet sm" style=${{marginTop:'8px'}} onClick=${()=>setGr(cur.m)}>Show ${cur.m} in the graph below</button>`:html`<p className="sub">No units yet.</p>`}</section></div>
  <div className="ghow" style=${{marginTop:'10px'}}><span><i style=${{width:'18px',height:'18px'}}></i>Bigger circle = more units</span><span>Colour and % = top scent family</span><span>Click a market for its full mix · drag to move · +/− to zoom</span><span>Lines = supply from our plant (sample)</span></div>
  <div className="head" style=${{marginTop:'36px',marginBottom:'6px'}}><div><h2>Olfactory graph</h2><p className="sub">${gr==='All'?'All markets. Pick one to see which notes sell there.':'Showing '+gr+'. Thicker lines and bigger dots mean more units sold there.'}</p></div>
    <label className="sub">Where <select className="field" style=${{display:'inline-block',width:'auto',marginLeft:'6px'}} value=${gr} onChange=${e=>setGr(e.target.value)}><option value="All">All markets</option>${nodes.map(n=>html`<option key=${n.m}>${n.m}</option>`)}</select></label></div>
  <div onClick=${e=>{const b=e.target.closest&&e.target.closest('[data-go]');if(b)go(b.dataset.go)}}><${OlfGraph} key=${staff?'s':'c'} en=${en} sty=${sty} staff=${staff} gr=${gr}/></div>`;
}

/* ================= client: requests ================= */
function Ideas({requests,addRequest}){
  const[f,setF]=useState({title:'',cat:'Deodorant',qty:''});const[err,setErr]=useState('');const mine=requests.filter(r=>r.client===BRANDS[ME]);
  const submit=e=>{e.preventDefault();if(!f.title.trim())return setErr('Please describe what you need in a few words.');setErr('');addRequest({title:f.title.trim(),cat:f.cat,qty:f.qty||'—'});setF({...f,title:'',qty:''})};
  return html`<div className="head"><div><h1>Ask our perfumers</h1><p className="lead">Request a sample, a new oil for a product, or a twist on one you use. We reply here.</p></div></div>
  <div className="grid"><form className="card form" onSubmit=${submit}><label>What do you need?<input className="field" value=${f.title} onInput=${e=>setF({...f,title:e.target.value})} placeholder="For example: a fresher oil for our sport deodorant"/></label>
    <div className="two"><label>For which product type<select className="field" value=${f.cat} onChange=${e=>setF({...f,cat:e.target.value})}>${CATS.map(x=>html`<option key=${x}>${x}</option>`)}</select></label>
    <label>Expected yearly units<input className="field" inputMode="numeric" value=${f.qty} onInput=${e=>setF({...f,qty:e.target.value})} placeholder="50,000"/></label></div>
    ${err&&html`<div className="msg err" role="alert" style=${{margin:'0 0 14px'}}>${err}</div>`}<button className="btn">Send request</button></form>
   <section className="card"><h2>Your requests</h2><ul className="list">${mine.length?mine.map(r=>html`<li key=${r.id} style=${{display:'block'}}><div style=${{display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}><b>${r.title}</b><span className=${'pill'+(r.reply?' ok':'')}>${r.status}</span></div><div className="sub">${r.cat} · ${r.qty} units a year</div>${r.reply&&html`<div className="msg" style=${{marginTop:'8px'}}>Reply from our team: ${r.reply}</div>`}</li>`):html`<li className="empty">No requests yet.</li>`}</ul></section></div>`;
}

/* ================= staff ================= */
function Attention({items,done,go}){
  return html`<div className="head"><div><h1>${items.length?`${items.length} things need your attention`:'All clear'}</h1><p className="lead">Client requests and account problems in one list. Each item says why it is here.</p></div></div>
  <section className="card"><ul className="list">${items.length?items.map(a=>html`<li key=${a.id}><div style=${{flex:'1 1 20em'}}><span className=${'pill'+(a.kind==='Request'?' wine':'')}>${a.kind}</span> <b style=${{marginLeft:'6px'}}>${a.who}</b><div style=${{marginTop:'4px'}}>${a.text}</div><div className="sub">${a.why}</div></div>
    <div style=${{display:'flex',gap:'8px'}}><button className="btn sm" onClick=${()=>go(a.go)}>Open</button><button className="btn quiet sm" data-done=${a.id} onClick=${()=>done(a.id)}>Mark done</button></div></li>`):html`<li className="empty">Nothing to do.</li>`}</ul></section>`;
}
function Clients({products,uploads,clients,toggle,audit}){
  return html`<div className="head"><div><h1>Clients</h1><p className="lead">Staff can see every brand by name. Clients only ever see the market view without names. Every change here goes to the audit log.</p></div></div>
  <section className="card"><div className="scroll"><table><thead><tr><th>Client</th><th className="num">Products</th><th className="num">Oils used</th><th>Last upload</th><th>Volumes from our sales</th><th>AI column matching</th></tr></thead>
   <tbody>${Object.entries(BRANDS).map(([id,name])=>{const ps=products.filter(p=>p.brand===id),c=clients[id];return html`<tr key=${id}><td><b style=${{fontWeight:500}}>${name}</b></td><td className="num">${ps.length}</td><td className="num">${new Set(ps.map(p=>p.oil)).size}</td><td>${c.last}</td><td>${c.ourSales?html`<span className="pill ok">Allowed by client</span>`:html`<span className="pill line">Not allowed</span>`}</td>
    <td><label className="switch"><input type="checkbox" checked=${c.ai} onChange=${()=>toggle(id,'ai')}/>${c.ai?'On':'Off'}</label></td></tr>`})}</tbody></table></div>
   <p className="sub" style=${{marginTop:'10px'}}>"Volumes from our sales" is the client's own choice, made on their Portfolio page. AI matching is a later feature; the switch records the choice now.</p></section>
  <section className="card" style=${{marginTop:'20px'}}><h2>Audit log</h2><div className="scroll"><table><thead><tr><th>When</th><th>Who</th><th>What happened</th></tr></thead><tbody>${audit.map((a,i)=>html`<tr key=${i}><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td></tr>`)}</tbody></table></div></section>`;
}
function Featured({feat,setFeat,products}){
  return html`<div className="head"><div><h1>Featured oils</h1><p className="lead">Choose the oils to push to clients: new inspirations from our perfumers, or ready stock to move. Featured oils appear on every client's home page and in their gaps list.</p></div></div>
  <section className="card"><div className="scroll"><table><thead><tr><th>Oil</th><th>Family</th><th className="num">Brands using it</th><th>Brands not using it</th><th>Feature as</th></tr></thead>
   <tbody>${Object.keys(OILS).map(c=>{const b=new Set(products.filter(p=>p.oil===c).map(p=>p.brand));const not=Object.keys(BRANDS).filter(x=>!b.has(x)).map(x=>BRANDS[x].split(' ')[0]);
    return html`<tr key=${c}><td><${OilName} code=${c}/></td><td>${OILS[c].fam}</td><td className="num">${b.size}</td><td style=${{whiteSpace:'normal'}}>${not.join(', ')||'—'}</td>
     <td><select className="field" style=${{marginTop:0,minWidth:'11em'}} aria-label=${'Feature '+OILS[c].name+' as'} value=${feat[c]||''} onChange=${e=>setFeat(c,e.target.value)}><option value="">Not featured</option><option>New inspiration</option><option>Ready stock</option></select></td></tr>`})}</tbody></table></div></section>`;
}
function Requests({requests,reply}){
  const[d,setD]=useState({});
  return html`<div className="head"><div><h1>Client requests</h1><p className="lead">Reply to a request and the client sees your answer in their portal.</p></div></div>
  <section className="card"><ul className="list">${requests.map(r=>html`<li key=${r.id} style=${{display:'block'}}><div style=${{display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}><div><b>${r.title}</b><div className="sub">${r.client} · ${r.cat} · ${r.qty} units a year</div></div><span className=${'pill'+(r.reply?' ok':' wine')}>${r.status}</span></div>
    ${r.reply?html`<div className="msg" style=${{marginTop:'8px'}}>Your reply: ${r.reply}</div>`:html`<form data-rid=${r.id} style=${{display:'flex',gap:'8px',marginTop:'10px',flexWrap:'wrap',alignItems:'end'}} onSubmit=${e=>{e.preventDefault();const v=(d[r.id]||'').trim();if(v)reply(r.id,v)}}><input className="field" aria-label=${'Reply to '+r.client} placeholder="Write a reply" value=${d[r.id]||''} onInput=${e=>setD({...d,[r.id]:e.target.value})} style=${{flex:'1 1 16em',width:'auto'}}/><button className="btn sm">Send reply</button></form>`}</li>`)}</ul></section>`;
}

/* ================= app shell ================= */
const NAV={client:[['home','Home','home','Upload your portfolio'],['market','Market view','chart','What the market uses'],['portfolio','Portfolio','box','Your products and oils'],['graph','Graphs','graph','Map and olfactory graph'],['oils','Our oils','drop','Catalog and scent'],['ideas','Ask us','idea','Samples and new oils']],staff:[['attention','Needs attention','bell','Your to-do list'],['clients','Clients','users','Brands and settings'],['graph','Graphs','graph','Map and olfactory graph'],['featured','Featured oils','star','What to push'],['requests','Requests','inbox','Reply to clients']]};
const stamp=()=>{const d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toTimeString().slice(0,5)};
const REQ0=[{id:1,client:'Nimbus Hygiene',title:'Sample of a fresher oil for our sport deodorant',cat:'Deodorant',qty:'60,000',status:'Waiting for reply',reply:''},{id:2,client:'Verde Home & Body',title:'Coconut oil with longer-lasting base for soap',cat:'Soap',qty:'200,000',status:'Waiting for reply',reply:''}];
const ATT0=[{id:'a1',kind:'Request',who:'Nimbus Hygiene',text:'Asked for a sample of a fresher oil for their sport deodorant.',why:'Every new client request appears here.',go:'requests'},{id:'a2',kind:'Account',who:'Coastline Cosmetics',text:`No ${CUR} portfolio uploaded yet.`,why:'Shown when a quarter ends without an upload.',go:'clients'},{id:'a3',kind:'Request',who:'Verde Home & Body',text:'Asked for a coconut oil with a longer-lasting base for soap.',why:'Every new client request appears here.',go:'requests'}];
const CL0={aurel:{last:'2 Oct 2026',ourSales:false,ai:false},nimbus:{last:'4 Oct 2026',ourSales:true,ai:false},verde:{last:'1 Oct 2026',ourSales:false,ai:false},coast:{last:'3 Jul 2026',ourSales:false,ai:false}};
function App(){
  const[role,setRole]=useState('client'),[page,setPage]=useState('home');
  const[products,setProducts]=useState(P0),[uploads,setUploads]=useState([{name:'aurel-portfolio-q3.csv',rows:4,when:'2 Oct 2026'}]),[feat,setFeatAll]=useState(FEAT0);
  const[requests,setRequests]=useState(REQ0),[att,setAtt]=useState(ATT0),[clients,setClients]=useState(CL0),[audit,setAudit]=useState([['20 Nov 2026 10:05','staff@manufacturer (sample)','Featured CS-110 Lavender Field as "Ready stock"']]);
  const[toast,setToast]=useState(null);const tm=useRef();
  const say=(text,undo)=>{setToast({text,undo});clearTimeout(tm.current);tm.current=setTimeout(()=>setToast(null),5000)};
  const log=(who,w)=>setAudit(a=>[[stamp(),who,w],...a]);
  const switchRole=r=>{setRole(r);setPage(NAV[r][0][0]);window.scrollTo(0,0)};const go=p=>{setPage(p);window.scrollTo(0,0)};
  const addRequest=r=>{const id=Date.now();setRequests(q=>[{id,client:BRANDS[ME],status:'Waiting for reply',reply:'',...r},...q]);setAtt(a=>[{id:'a'+id,kind:'Request',who:BRANDS[ME],text:'Asked: '+r.title+'.',why:'Every new client request appears here.',go:'requests'},...a]);say('Request sent. Our team will reply in "Ask us".')};
  const onSaved=(name,rows)=>{setProducts(ps=>{const out=ps.map(p=>({...p,units:{...p.units}}));rows.forEach(r=>{const ex=out.find(p=>p.brand===ME&&p.name===r.name);if(ex){Object.assign(ex,{cat:r.cat,oil:r.oil,market:r.market,launch:r.launch});ex.units[r.period]=r.units}else out.push({brand:ME,name:r.name,cat:r.cat,oil:r.oil,market:r.market,launch:r.launch,units:{[r.period]:r.units}})});return out});setUploads(u=>[{name,rows:rows.length,when:'Today'},...u]);setClients(c=>({...c,[ME]:{...c[ME],last:'Today'}}))};
  let view;
  if(page==='home')view=html`<${Home} products=${products} uploads=${uploads} feat=${feat} onSaved=${onSaved} go=${go}/>`;
  else if(page==='market')view=html`<${Market} products=${products} feat=${feat} ask=${(code,cat)=>addRequest({title:`Sample of ${code} ${OILS[code].name}`+(cat?` for our ${cat.toLowerCase()}`:''),cat:cat||'Deodorant',qty:'—'})}/>`;
  else if(page==='portfolio')view=html`<${Portfolio} go=${go} products=${products} useOurSales=${clients[ME].ourSales} setUseOurSales=${v=>{setClients(c=>({...c,[ME]:{...c[ME],ourSales:v}}));log('client@aurel (sample)',`${v?'Allowed':'Stopped'} use of oil sales records to fill in volumes`);say(v?'Saved. We may now fill in your volumes from our sales records.':'Saved. We will only use the numbers you upload.')}}/>`;
  else if(page==='graph')view=html`<${Graphs} key=${role} products=${products} role=${role} go=${go}/>`;
  else if(page==='oils')view=html`<${Oils} feat=${feat} products=${products}/>`;
  else if(page==='ideas')view=html`<${Ideas} requests=${requests} addRequest=${addRequest}/>`;
  else if(page==='attention')view=html`<${Attention} items=${att} go=${go} done=${id=>{const i=att.findIndex(a=>a.id===id),it=att[i];setAtt(a=>a.filter(x=>x.id!==id));say('Marked done.',()=>setAtt(a=>{const n=[...a];n.splice(i,0,it);return n}))}}/>`;
  else if(page==='clients')view=html`<${Clients} products=${products} uploads=${uploads} clients=${clients} audit=${audit} toggle=${(id,k)=>{const v=!clients[id][k];setClients(c=>({...c,[id]:{...c[id],[k]:v}}));log('staff@manufacturer (sample)',`Turned ${v?'on':'off'} AI column matching for ${BRANDS[id]}`)}}/>`;
  else if(page==='featured')view=html`<${Featured} feat=${feat} products=${products} setFeat=${(c,v)=>{setFeatAll(f=>{const n={...f};if(v)n[c]=v;else delete n[c];return n});log('staff@manufacturer (sample)',v?`Featured ${c} ${OILS[c].name} as "${v}"`:`Stopped featuring ${c} ${OILS[c].name}`);say(v?`${OILS[c].name} is now featured to all clients.`:`${OILS[c].name} is no longer featured.`)}}/>`;
  else view=html`<${Requests} requests=${requests} reply=${(id,text)=>{const r=requests.find(x=>x.id===id);setRequests(q=>q.map(x=>x.id===id?{...x,reply:text,status:'Answered'}:x));setAtt(a=>a.filter(x=>!(x.kind==='Request'&&x.who===r.client)));log('staff@manufacturer (sample)',`Replied to "${r.title}" from ${r.client}`);say('Reply sent.')}}/>`;
  const nav=NAV[role];
  return html`<div className="app"><aside><div className="brand">Client Studio<small>Prototype · all data is sample</small></div>
    <div className="who" role="group" aria-label="View as"><button id="r-client" aria-pressed=${role==='client'} onClick=${()=>switchRole('client')}>Client: Aurel Personal Care</button><button id="r-staff" aria-pressed=${role==='staff'} onClick=${()=>switchRole('staff')}>Our team</button></div>
    <nav className="nav" aria-label="Sections">${nav.map(([k,l,ic,hint])=>html`<button key=${k} data-tab=${k} aria-current=${page===k?'page':undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/><span>${l}<br/><span className="sub">${hint}</span></span>${k==='attention'&&att.length>0&&html`<span className="count">${att.length}</span>`}</button>`)}</nav>
    <div className="foot">Prototype for review. Four sample brands. Changes reset when you reload.</div></aside>
   <main>${view}</main>
   <nav className="tabbar" aria-label="Sections">${nav.map(([k,l,ic])=>html`<button key=${k} data-mtab=${k} aria-current=${page===k?'page':undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/>${({'Market view':'Market','Our oils':'Oils','Needs attention':'To do','Featured oils':'Featured'})[l]||l}</button>`)}</nav>
   ${toast&&html`<div className="toast" role="status">${toast.text}${toast.undo&&html`<button onClick=${()=>{toast.undo();setToast(null)}}>Undo</button>`}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>

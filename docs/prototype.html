.field{display:block;width:100%;margin-top:6px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 12px;font-size:16px;color:var(--ink)}

.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}.switch input{width:20px;height:20px;accent-color:var(--wine);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:9;max-width:calc(100% - 32px)}

.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:8}
.tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);min-height:56px;cursor:pointer}
.tabbar button[aria-current=page]{color:var(--wine)}main{padding-bottom:110px}}
@media(max-width:600px){.two{grid-template-columns:1fr}table{font-size:13px}th,td{padding:7px 5px}.card{padding:18px}.big{font-size:30px}.maprow{grid-template-columns:minmax(0,1fr) 28px}.maprow .lbl{grid-column:1/-1}.oilrow{grid-template-columns:minmax(0,1fr) 3.6em}.oilrow .t,.oilrow .hid{grid-column:1/-1;grid-row:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
{
const {useState,useRef,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pct=n=>(n*100).toFixed(n<.1?1:0)+'%';

/* ================= sample data (all made up) ================= */
const CUR='Q4 2026',PREV='Q3 2026',PERIODS=[PREV,CUR];
const CATS=['Deodorant','Soap','Body wash','Shampoo'];
const FAM={Fresh:'var(--f-fresh)',Floral:'var(--f-floral)',Woody:'var(--f-woody)',Oriental:'var(--f-oriental)',Aromatic:'var(--f-aromatic)',Gourmand:'var(--f-gourmand)',Herbal:'var(--f-herbal)'};
const OILS={
 'CS-101':{name:'Aqua Citrus',fam:'Fresh',mood:'Clean, zesty citrus for everyday freshness.',top:[['Bergamot','fresh citrus, like Earl Grey tea'],['Lemon','sharp and sparkling']],heart:[['Green tea','soft, clean and green'],['Mint','cool and bright']],base:[['White musk','clean, like fresh laundry']]},
 'CS-102':{name:'Ocean Breeze',fam:'Fresh',mood:'Sea air and soft lavender. Popular in deodorants.',top:[['Sea salt','airy and mineral'],['Marine accord','cool, watery']],heart:[['Lavender','calm, herbal floral']],base:[['Driftwood','pale, dry wood'],['Musk','soft skin warmth']]},
 'CS-110':{name:'Lavender Field',fam:'Aromatic',mood:'Classic lavender, calm and clean.',top:[['Lavender','calm, herbal floral']],heart:[['Geranium','rosy and green']],base:[['Tonka bean','soft, almond-like warmth']]},
 'CS-120':{name:'White Jasmine',fam:'Floral',mood:'Soft white flowers with a fruity lift.',top:[['Pear','juicy and light']],heart:[['Jasmine','sweet white flower'],['Orange blossom','honeyed white flower']],base:[['Musk','soft skin warmth']]},
 'CS-121':{name:'Rose Garden',fam:'Floral',mood:'A fresh, modern rose.',top:[['Lychee','sweet, juicy fruit']],heart:[['Rose','rich, classic rose'],['Peony','soft, airy flower']],base:[['Cedar','light, dry wood']]},
 'CS-130':{name:'Sandal Cream',fam:'Woody',mood:'Creamy sandalwood, a long-time soap favourite.',top:[['Cardamom','cool, aromatic spice']],heart:[['Iris','powdery and elegant']],base:[['Sandalwood','creamy wood'],['Vanilla','soft sweetness']]},
 'CS-131':{name:'Cedar Sport',fam:'Woody',mood:'Dry woods with a citrus kick, for men\'s ranges.',top:[['Grapefruit','sharp, sparkling citrus']],heart:[['Cedarwood','dry, like pencil shavings']],base:[['Vetiver','smoky roots']]},
 'CS-140':{name:'Oud Amber',fam:'Oriental',mood:'Rich oud and amber for the GCC market.',top:[['Saffron','honeyed, leathery spice']],heart:[['Rose','rich, classic rose']],base:[['Oud','smoky, resinous wood'],['Amber','warm, resinous sweetness']]},
 'CS-150':{name:'Coconut Milk',fam:'Gourmand',mood:'Creamy coconut and tropical flowers.',top:[['Coconut','creamy and sweet']],heart:[['Frangipani','tropical, buttery flower']],base:[['Vanilla','soft sweetness']]},
 'CS-160':{name:'Neem & Aloe',fam:'Herbal',mood:'Green, herbal and skin-friendly in feel.',top:[['Aloe','watery green']],heart:[['Neem leaf','bitter, herbal green']],base:[['Oakmoss','damp forest floor']]}};
const BRANDS={aurel:'Aurel Personal Care',nimbus:'Nimbus Hygiene',verde:'Verde Home & Body',coast:'Coastline Cosmetics'};
const ME='aurel';
const P0=[
 ['aurel','Aurel Fresh Deo','Deodorant','CS-101','GCC','2025-03',42000,45000],['aurel','Aurel Sport Deo','Deodorant','CS-131','GCC','2024-09',30000,28000],['aurel','Aurel Rose Soap','Soap','CS-121','India','2023-05',80000,78000],['aurel','Aurel Sandal Soap','Soap','CS-130','India','2022-01',95000,99000],
 ['nimbus','Nimbus Ocean Deo','Deodorant','CS-102','Europe','2024-02',52000,61000],['nimbus','Nimbus Active Deo','Deodorant','CS-131','Europe','2023-08',26000,24000],['nimbus','Nimbus Citrus Wash','Body wash','CS-101','Europe','2025-06',18000,22000],['nimbus','Nimbus Lavender Soap','Soap','CS-110','United Kingdom','2021-10',40000,43000],
 ['verde','Verde Neem Soap','Soap','CS-160','India','2020-04',120000,126000],['verde','Verde Coconut Soap','Soap','CS-150','Southeast Asia','2024-11',60000,72000],['verde','Verde Jasmine Wash','Body wash','CS-120','India','2025-01',25000,27000],['verde','Verde Herbal Shampoo','Shampoo','CS-160','India','2022-07',30000,31000],
 ['coast','Coast Oud Deo','Deodorant','CS-140','GCC','2025-09',38000,47000],['coast','Coast Ocean Deo','Deodorant','CS-102','GCC','2025-04',20000,26000],['coast','Coast Coconut Shampoo','Shampoo','CS-150','Southeast Asia','2025-02',22000,29000],['coast','Coast Sandal Soap','Soap','CS-130','GCC','2023-03',35000,34000]
].map(([brand,name,cat,oil,market,launch,a,b])=>({brand,name,cat,oil,market,launch,units:{[PREV]:a,[CUR]:b}}));
const FEAT0={'CS-120':'New inspiration','CS-110':'Ready stock'};
const REGIONS={'GCC':[25,51],'India':[21,78],'Europe':[48,10],'United Kingdom':[53,-2],'North America':[40,-95],'Southeast Asia':[5,108]};

/* ================= market analytics (nameless, consolidated) ================= */
/* Privacy rule shown in the UI: a figure is hidden when only one other brand is behind it. */
function oilStats(products,period,cat){
  const rows=products.filter(p=>(cat==='All'||p.cat===cat)&&p.units[period]>0);const by={};
  rows.forEach(p=>{const o=by[p.oil]||(by[p.oil]={code:p.oil,units:0,brands:new Set()});o.units+=p.units[period];o.brands.add(p.brand)});
  const all=Object.values(by).map(o=>({...o,mine:o.brands.has(ME),hidden:o.brands.size<2&&!o.brands.has(ME)}));
  const tot=all.filter(o=>!o.hidden).reduce((s,o)=>s+o.units,0)||1;
  /* shares are worked out among visible oils only, so hidden volumes cannot be back-calculated; hidden oils go last */
  return all.map(o=>({...o,share:o.hidden?0:o.units/tot})).sort((a,b)=>(a.hidden-b.hidden)||(b.units-a.units));
}
function rising(products,cat){
  const a=Object.fromEntries(oilStats(products,PREV,cat).map(o=>[o.code,o.share]));
  return oilStats(products,CUR,cat).filter(o=>!o.hidden&&o.brands.size>=2).map(o=>({...o,delta:o.share-(a[o.code]||0)})).filter(o=>o.delta>0.001).sort((x,y)=>y.delta-x.delta).slice(0,3);
}
function gaps(products,feat){
  const mine=products.filter(p=>p.brand===ME);const out=[];
  [...new Set(mine.map(p=>p.cat))].forEach(cat=>{const used=new Set(mine.filter(p=>p.cat===cat).map(p=>p.oil));
    oilStats(products,CUR,cat).filter(o=>!o.hidden&&o.brands.size>=2&&!used.has(o.code)).slice(0,2).forEach(o=>out.push({code:o.code,why:`${pct(o.share)} of shared ${cat.toLowerCase()} volume, used by ${o.brands.size} brands`,cat}))});
  const all=new Set(mine.map(p=>p.oil));Object.entries(feat).forEach(([c,tag])=>{if(!all.has(c)&&!out.some(g=>g.code===c))out.push({code:c,why:tag==='New inspiration'?'New from our perfumers':'Ready stock, available now',cat:null,tag})});
  return out;
}
function families(products,cat,who){
  const rows=products.filter(p=>(cat==='All'||p.cat===cat)&&(!who||p.brand===who)&&p.units[CUR]>0);const f={};
  rows.forEach(p=>{const k=OILS[p.oil].fam,o=f[k]||(f[k]={u:0,b:new Set()});o.u+=p.units[CUR];o.b.add(p.brand)});
  const vis=Object.entries(f).filter(([,o])=>who||o.b.size>=2||o.b.has(ME));const tot=vis.reduce((s,[,o])=>s+o.u,0)||1;
  return vis.map(([k,o])=>[k,o.u/tot]).sort((a,b)=>b[1]-a[1]);

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
function checkRow(r,map,n){const g=k=>(r[map[k]]||'').trim();const e=[];
  if(!g('product'))e.push('product name is empty');
  if(!CATS.includes(g('cat')))e.push(`category "${g('cat')}" is not one of: ${CATS.join(', ')}`);
  if(!OILS[g('oil').toUpperCase()])e.push(`oil code ${g('oil')||'(empty)'} is not in our catalog`);
  if(!REGIONS[g('market')])e.push(`market "${g('market')}" is not recognised`);
  if(!PERIODS.includes(g('period')))e.push(`period "${g('period')}" should be ${PERIODS.join(' or ')}`);

  return e.length?{n,e}:null}

  const input=useRef(null);
  const read=f=>{setErr('');
    if(!/\.csv$/i.test(f.name))return setErr(`"${f.name}" is not a CSV file. In Excel choose Save As, then CSV, and try again. (Excel and PDF files are accepted in the real app.)`);
    if(f.size>5*1024*1024)return setErr(`This file is ${(f.size/1048576).toFixed(1)} MB. The limit is 5 MB.`);
    f.text().then(t=>{const all=parseCSV(t);const heads=(all.shift()||[]).map(h=>h.trim());const rows=all.map(r=>Object.fromEntries(heads.map((h,i)=>[h,(r[i]||'').trim()])));
      if(!rows.length)return setErr('This file has no rows. Check that it is the right file.');setFile({name:f.name,heads,rows});setMap(guess(heads));setStep(2)})};
  const missing=FIELDS.filter(([k])=>!map[k]);

  const good=file?file.rows.length-problems.length:0;
  const save=()=>{setSaving(true);setTimeout(()=>{const bad=new Set(problems.map(p=>p.n));const rows=file.rows.filter((r,i)=>!bad.has(i+2)).map(r=>({name:r[map.product],cat:r[map.cat],oil:r[map.oil].toUpperCase(),market:r[map.market],launch:r[map.launch],period:r[map.period],units:parseFloat(r[map.units].replace(/,/g,''))}));
    onSaved(file.name,rows);setResult({rows:rows.length,skipped:bad.size,oils:new Set(rows.map(r=>r.oil)).size});setSaving(false);setStep(3)},900)};
  const reset=()=>{setStep(1);setFile(null);setResult(null);setErr('')};

    ${step===1&&html`<div className=${'drop'+(over?' over':'')} onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);e.dataTransfer.files[0]&&read(e.dataTransfer.files[0])}}>
      <button className="btn" style=${{fontSize:'18px',minHeight:'56px',padding:'0 30px'}} onClick=${()=>input.current.click()}>Choose portfolio file</button>
      <p className="sub" style=${{marginTop:'10px'}}>or drag it here · CSV, up to 5 MB</p>
      <button className="link" id="useSample" onClick=${()=>read(new File([SAMPLE_CSV],'aurel-portfolio-q4.csv',{type:'text/csv'}))}>Try a sample file</button> · <button className="link" onClick=${()=>setShowFmt(!showFmt)}>${showFmt?'Hide':'See'} the file format</button>
      <input ref=${input} type="file" accept=".csv,text/csv" hidden onChange=${e=>e.target.files[0]&&read(e.target.files[0])}/></div>
      ${showFmt&&html`<div className="scroll" style=${{marginTop:'14px'}}><table className="fmt"><thead><tr><th>Column</th><th>What to put</th><th>Example</th></tr></thead><tbody>${FORMAT.map(([c,w,e])=>html`<tr key=${c}><td><b style=${{fontWeight:500}}>${c}</b></td><td>${w}</td><td>${e}</td></tr>`)}</tbody></table><p className="sub" style=${{marginTop:'6px'}}>Column names can differ; you match them in the next step.</p></div>`}
      ${err&&html`<div className="msg err" role="alert">${err}</div>`}`}
    ${step===2&&html`<div className="msg"><b>${file.name}</b> · ${file.rows.length} products found. Check which column holds each piece of information.</div>
      ${FIELDS.map(([k,label])=>html`<div key=${k} className=${'maprow'+(map[k]?'':' miss')}><span className="lbl">${label}</span>
        <select aria-label=${'Column for '+label} data-f=${k} value=${map[k]} onChange=${e=>setMap({...map,[k]:e.target.value})}><option value="">Choose a column…</option>${file.heads.map(h=>html`<option key=${h} value=${h}>${h}${file.rows[0][h]?' (e.g. '+file.rows[0][h]+')':''}</option>`)}</select>

      ${missing.length>0&&html`<div className="msg err" role="status">We could not find <b>${missing.map(m=>m[1]).join(', ')}</b> automatically. Pick the right column above.</div>`}
      ${!missing.length&&problems.length>0&&html`<div className="msg err" id="problems" role="status"><b>${problems.length} ${problems.length===1?'row needs':'rows need'} fixing and will be skipped:</b>${problems.map(p=>html`<div key=${p.n}>Row ${p.n}: ${p.e.join('; ')}.</div>`)}</div>`}
      <div style=${{display:'flex',gap:'10px',flexWrap:'wrap',marginTop:'16px'}}><button className="btn" id="confirm" disabled=${missing.length>0||saving||!good} onClick=${save}>${saving?'Saving…':`Save ${good} products`}</button><button className="btn quiet" onClick=${reset}>Start again</button></div>`}
    ${step===3&&html`<div className="msg" id="saved" style=${{borderColor:'var(--ok)'}}><b style=${{color:'var(--ok)'}}>Saved.</b> ${result.rows} products using ${result.oils} of our oils.${result.skipped?` ${result.skipped} row skipped; fix it and upload again any time.`:''} The market view now includes your new numbers.</div>

  </section>`;

function WorldMap({byReg,mapStyle}){

  let body=null;if(W&&Object.keys(byReg).length){const k=Math.min(W/360,H/136),ox=(W-360*k)/2,oy=(H-136*k)/2,X=lo=>ox+(lo+180)*k,Y=la=>oy+(80-la)*k,holo=mapStyle==='Hologram',mx=Math.max(...Object.values(byReg)),r0=Math.max(12,k*15),dr=Math.max(1,k*.75);
    const pts=Object.entries(byReg).map(([nm,v])=>{const[la,lo]=REGIONS[nm];return{nm,v,x:X(lo),y:Y(la),r:Math.max(5,Math.sqrt(v/mx)*r0)}});
    const short=nm=>W<520?({'United Kingdom':'UK','Southeast Asia':'SE Asia','North America':'N. America'}[nm]||nm):nm;
    body=html`<svg viewBox=${`0 0 ${W} ${H}`}>${DOTS.map(([lo,la],i)=>html`<circle key=${i} cx=${X(lo)} cy=${Y(la)} r=${dr} fill=${holo?'none':'var(--dot)'} stroke=${holo?'var(--gold)':'none'} strokeOpacity=".55"/>`)}
      ${pts.map(p=>holo?html`<g key=${p.nm}><circle cx=${p.x} cy=${p.y} r=${p.r} fill="none" stroke="var(--wine)" strokeWidth="1.5"/><circle cx=${p.x} cy=${p.y} r=${p.r*.55} fill="none" stroke="var(--wine)" strokeOpacity=".5"/><circle cx=${p.x} cy=${p.y} r="2.5" fill="var(--wine)"/></g>`:html`<circle key=${p.nm} cx=${p.x} cy=${p.y} r=${p.r} fill="var(--wine)" fillOpacity=".8" stroke="var(--surface)"/>`)}
      ${pts.map(({nm,v,x,y,r})=>{const d=LBL[nm];const[a,tx,ty]=d==='nw'?['end',x-r*.6,y-r-4]:d==='w'?['end',x-r-5,y+4]:d==='e'?['start',x+r+5,y+4]:d==='ne'?['start',x+r*.7+3,y-r*.7-3]:['middle',x,y-r-6];
        return html`<text key=${'t'+nm} x=${tx} y=${ty} textAnchor=${a} fontSize="13" fill="var(--ink)" style=${{paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'}}>${short(nm)} ${fmt(v/1000)}k</text>`})}</svg>`}
  return html`<div className="fig" ref=${ref} role="img" aria-label="World map of your units sold by market">${body}</div>`;

   <tbody>${mine.map(p=>html`<tr key=${p.name}><td><b style=${{fontWeight:500}}>${p.name}</b></td><td>${p.cat}</td><td><${OilName} code=${p.oil}/></td><td>${p.market}</td><td>${p.launch}</td><td className="num">${p.units[PREV]?fmt(p.units[PREV]):'—'}</td><td className="num">${p.units[CUR]?fmt(p.units[CUR]):'—'}</td></tr>`)}</tbody></table></div></section>
  <div className="grid" style=${{marginTop:'20px'}}><section className="card"><div className="head" style=${{marginBottom:'6px'}}><div><h2>Where your units sell</h2><p className="sub">${CUR}. Bigger circle, more units.</p></div><${Seg} value=${mapStyle} set=${setMapStyle} opts=${['Classic','Hologram']} label="Map style"/></div>
     <${WorldMap} byReg=${byReg} mapStyle=${mapStyle}/><p className="sub">Prototype drawing. The real app uses MapLibre with OpenStreetMap data (© OpenStreetMap contributors).</p></section>
   <section className="card"><h2>Your data choices</h2><p className="sub">You decide what we may use.</p>
     <label className="switch" style=${{marginTop:'12px',alignItems:'flex-start'}}><input type="checkbox" id="ourSales" checked=${useOurSales} onChange=${e=>setUseOurSales(e.target.checked)} style=${{marginTop:'3px'}}/><span>Fill in my volumes from your oil sales records<br/><span className="sub">If you skip units sold in your file, we estimate them from the oil we supplied you. Off by default.</span></span></label>
     <p className="sub" style=${{marginTop:'12px'}}>Your products always count towards the market view without your name. Changes are recorded in our audit log.</p></section></div>`;
}

/* ================= client: our oils (scent over time) ================= */
const PH=[['top','Top notes','First impression','0 – 30 min','var(--gold)'],['heart','Heart notes','The main character','30 min – 4 h','var(--wine)'],['base','Base notes','What stays','4 h and longer','var(--base)']];
const curve={top:t=>Math.exp(-t/.4),heart:t=>{const p=1.3;return Math.pow(t/p,1.6)*Math.exp(1.6*(1-t/p))},base:t=>.85*(1-Math.exp(-t/1.6))*Math.exp(-t/30)};
const TMAX=8,TT=[0,.25,.5,1,2,4,6,8],tl=t=>t===0?'Use':t<1?Math.round(t*60)+' min':t+' h';
function ScentChart({name,t}){
  const[ref,{w:W,h:H}]=useSize();let body=null;
  if(W){const m={l:8,r:8,t:30,b:30},X=v=>m.l+Math.sqrt(v/TMAX)*(W-m.l-m.r),Y=v=>H-m.b-v*(H-m.t-m.b);
    const path=f=>{let d=`M${X(0)},${Y(0)}`;for(let i=0;i<=120;i++){const v=TMAX*(i/120)**2;d+=`L${X(v)},${Y(Math.min(1,f(v)))}`}return d+`L${X(TMAX)},${Y(0)}Z`};
    const lab={paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'};
    body=html`<svg viewBox=${`0 0 ${W} ${H}`}>${TT.map(v=>html`<g key=${v}><line x1=${X(v)} x2=${X(v)} y1=${m.t} y2=${H-m.b} stroke="var(--line)"/><text x=${X(v)} y=${H-8} fontSize="13" fill="var(--muted)" textAnchor=${v===0?'start':v===TMAX?'end':'middle'}>${W<480&&(v===.25||v===6)?'':tl(v)}</text></g>`)}
      ${PH.map(([k,,,,c])=>html`<path key=${k} d=${path(curve[k])} fill=${c} fillOpacity=".2" stroke=${c} strokeWidth="2"/>`)}
      <text x=${X(.02)+6} y=${Y(1)-10} fontSize="14" fontWeight="500" fill="var(--gold)" style=${lab}>${W<520?'Top':'Top notes'}</text>
      <text x=${X(1.3)} y=${Y(1)-10} fontSize="14" fontWeight="500" fill="var(--wine)" textAnchor="middle" style=${lab}>${W<520?'Heart':'Heart notes'}</text>
      <text x=${X(TMAX)-6} y=${Y(curve.base(TMAX))-10} fontSize="14" fontWeight="500" fill="var(--base)" textAnchor="end" style=${lab}>${W<520?'Base':'Base notes'}</text>
      <line x1=${X(t)} x2=${X(t)} y1=${m.t-14} y2=${H-m.b} stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="4 3"/></svg>`}
  return html`<div className="chart" ref=${ref} role="img" aria-label=${'How '+name+' smells over time: top notes fade within about 30 minutes, heart notes lead for a few hours, base notes last longest.'}>${body}</div>`;
}
function Oils({feat,products}){
  const codes=Object.keys(OILS);const[code,setCode]=useState('CS-102');const[i,setI]=useState(3);const t=TT[i];const o=OILS[code];
  const lv=Object.fromEntries(PH.map(([k])=>[k,curve[k](t)]));const order=PH.map(x=>x[0]).sort((a,b)=>lv[b]-lv[a]);const lead=order[0],second=lv[order[1]]>.3?order[1]:null;
  const ph=k=>PH.find(x=>x[0]===k);const nn=k=>o[k].map(n=>n[0].toLowerCase()).slice(0,2).join(' and ');
  const used=new Set(products.filter(p=>p.brand===ME).map(p=>p.oil));
  return html`<div className="head"><div><h1>Our oils</h1><p className="lead">Our fragrance-oil catalog. Pick an oil to see what it smells like and how the scent changes after use, from the first fresh burst to what stays on skin.</p></div></div>
  <div className="oils" role="group" aria-label="Choose an oil" style=${{marginBottom:'20px'}}>${codes.map(c=>html`<button key=${c} className=${'oilcard'+(feat[c]?' feat':'')} aria-pressed=${c===code} onClick=${()=>setCode(c)}><span className="code">${c}${feat[c]?' · '+feat[c]:''}</span><b>${OILS[c].name}</b><span className="sub"><span className="fdot" style=${{background:FAM[OILS[c].fam]}}></span>${OILS[c].fam}${used.has(c)?' · in your range':''}</span></button>`)}</div>
  <section className="card"><div className="head" style=${{marginBottom:'8px'}}><div><h2>${o.name} <span className="code">${code}</span></h2><p className="sub">${o.mood}</p></div><span className="pill wine">${o.fam}</span></div>
    <h3 style=${{marginTop:'12px'}}>What you smell over time</h3><p className="sub">Height shows how strongly each layer comes through.</p>
    <${ScentChart} name=${o.name} t=${t}/>
    <div className="slider"><label htmlFor="tsl" className="sub">Time since use</label><input id="tsl" type="range" min="0" max=${TT.length-1} step="1" value=${i} onInput=${e=>setI(+e.target.value)} aria-valuetext=${tl(t)}/></div>
    <div className="now" aria-live="polite"><b>${t===0?'Right after use':'After '+tl(t)}:</b> you mostly smell the ${ph(lead)[1].toLowerCase()} (${nn(lead)})${second?html`, with the ${ph(second)[1].toLowerCase()} (${nn(second)}) ${lv[second]>lv[lead]*.8?'almost as strong':'in the background'}`:''}.</div>
    <div className="phases">${PH.map(([k,label,role,when,c])=>html`<div key=${k} className=${'phase'+(k===lead?' active':'')} style=${{'--c':c}}><h3><i></i>${label}</h3><div className="when">${role} · ${when}</div>${o[k].map(([n,d])=>html`<div key=${n} className="note"><b>${n}</b><span>${d}</span></div>`)}</div>`)}</div>
  </section>`;
}

/* ================= client: requests ================= */
function Ideas({requests,addRequest}){
  const[f,setF]=useState({title:'',cat:'Deodorant',qty:''});const[err,setErr]=useState('');const mine=requests.filter(r=>r.client===BRANDS[ME]);
  const submit=e=>{e.preventDefault();if(!f.title.trim())return setErr('Please describe what you need in a few words.');setErr('');addRequest({title:f.title.trim(),cat:f.cat,qty:f.qty||'—'});setF({...f,title:'',qty:''})};
  return html`<div className="head"><div><h1>Ask our perfumers</h1><p className="lead">Request a sample, a new oil for a product, or a twist on one you use. We reply here.</p></div></div>
  <div className="grid"><form className="card form" onSubmit=${submit}><label>What do you need?<input className="field" value=${f.title} onInput=${e=>setF({...f,title:e.target.value})} placeholder="For example: a fresher oil for our sport deodorant"/></label>
    <div className="two"><label>For which product type<select className="field" value=${f.cat} onChange=${e=>setF({...f,cat:e.target.value})}>${CATS.map(x=>html`<option key=${x}>${x}</option>`)}</select></label>
    <label>Expected yearly units<input className="field" inputMode="numeric" value=${f.qty} onInput=${e=>setF({...f,qty:e.target.value})} placeholder="50,000"/></label></div>
    ${err&&html`<div className="msg err" role="alert" style=${{margin:'0 0 14px'}}>${err}</div>`}<button className="btn">Send request</button></form>
   <section className="card"><h2>Your requests</h2><ul className="list">${mine.length?mine.map(r=>html`<li key=${r.id} style=${{display:'block'}}><div style=${{display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}><b>${r.title}</b><span className=${'pill'+(r.reply?' ok':'')}>${r.status}</span></div><div className="sub">${r.cat} · ${r.qty} units a year</div>${r.reply&&html`<div className="msg" style=${{marginTop:'8px'}}>Reply from our team: ${r.reply}</div>`}</li>`):html`<li className="empty">No requests yet.</li>`}</ul></section></div>`;
}

/* ================= staff ================= */
function Attention({items,done,go}){
  return html`<div className="head"><div><h1>${items.length?`${items.length} things need your attention`:'All clear'}</h1><p className="lead">Client requests and account problems in one list. Each item says why it is here.</p></div></div>
  <section className="card"><ul className="list">${items.length?items.map(a=>html`<li key=${a.id}><div style=${{flex:'1 1 20em'}}><span className=${'pill'+(a.kind==='Request'?' wine':'')}>${a.kind}</span> <b style=${{marginLeft:'6px'}}>${a.who}</b><div style=${{marginTop:'4px'}}>${a.text}</div><div className="sub">${a.why}</div></div>
    <div style=${{display:'flex',gap:'8px'}}><button className="btn sm" onClick=${()=>go(a.go)}>Open</button><button className="btn quiet sm" data-done=${a.id} onClick=${()=>done(a.id)}>Mark done</button></div></li>`):html`<li className="empty">Nothing to do.</li>`}</ul></section>`;
}
function Clients({products,uploads,clients,toggle,audit}){
  return html`<div className="head"><div><h1>Clients</h1><p className="lead">Staff can see every brand by name. Clients only ever see the market view without names. Every change here goes to the audit log.</p></div></div>
  <section className="card"><div className="scroll"><table><thead><tr><th>Client</th><th className="num">Products</th><th className="num">Oils used</th><th>Last upload</th><th>Volumes from our sales</th><th>AI column matching</th></tr></thead>
   <tbody>${Object.entries(BRANDS).map(([id,name])=>{const ps=products.filter(p=>p.brand===id),c=clients[id];return html`<tr key=${id}><td><b style=${{fontWeight:500}}>${name}</b></td><td className="num">${ps.length}</td><td className="num">${new Set(ps.map(p=>p.oil)).size}</td><td>${c.last}</td><td>${c.ourSales?html`<span className="pill ok">Allowed by client</span>`:html`<span className="pill line">Not allowed</span>`}</td>
    <td><label className="switch"><input type="checkbox" checked=${c.ai} onChange=${()=>toggle(id,'ai')}/>${c.ai?'On':'Off'}</label></td></tr>`})}</tbody></table></div>
   <p className="sub" style=${{marginTop:'10px'}}>"Volumes from our sales" is the client's own choice, made on their Portfolio page. AI matching is a later feature; the switch records the choice now.</p></section>
  <section className="card" style=${{marginTop:'20px'}}><h2>Audit log</h2><div className="scroll"><table><thead><tr><th>When</th><th>Who</th><th>What happened</th></tr></thead><tbody>${audit.map((a,i)=>html`<tr key=${i}><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td></tr>`)}</tbody></table></div></section>`;
}
function Featured({feat,setFeat,products}){
  return html`<div className="head"><div><h1>Featured oils</h1><p className="lead">Choose the oils to push to clients: new inspirations from our perfumers, or ready stock to move. Featured oils appear on every client's home page and in their gaps list.</p></div></div>
  <section className="card"><div className="scroll"><table><thead><tr><th>Oil</th><th>Family</th><th className="num">Brands using it</th><th>Brands not using it</th><th>Feature as</th></tr></thead>
   <tbody>${Object.keys(OILS).map(c=>{const b=new Set(products.filter(p=>p.oil===c).map(p=>p.brand));const not=Object.keys(BRANDS).filter(x=>!b.has(x)).map(x=>BRANDS[x].split(' ')[0]);
    return html`<tr key=${c}><td><${OilName} code=${c}/></td><td>${OILS[c].fam}</td><td className="num">${b.size}</td><td style=${{whiteSpace:'normal'}}>${not.join(', ')||'—'}</td>
     <td><select className="field" style=${{marginTop:0,minWidth:'11em'}} aria-label=${'Feature '+OILS[c].name+' as'} value=${feat[c]||''} onChange=${e=>setFeat(c,e.target.value)}><option value="">Not featured</option><option>New inspiration</option><option>Ready stock</option></select></td></tr>`})}</tbody></table></div></section>`;
}
function Requests({requests,reply}){
  const[d,setD]=useState({});
  return html`<div className="head"><div><h1>Client requests</h1><p className="lead">Reply to a request and the client sees your answer in their portal.</p></div></div>
  <section className="card"><ul className="list">${requests.map(r=>html`<li key=${r.id} style=${{display:'block'}}><div style=${{display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}><div><b>${r.title}</b><div className="sub">${r.client} · ${r.cat} · ${r.qty} units a year</div></div><span className=${'pill'+(r.reply?' ok':' wine')}>${r.status}</span></div>
    ${r.reply?html`<div className="msg" style=${{marginTop:'8px'}}>Your reply: ${r.reply}</div>`:html`<form data-rid=${r.id} style=${{display:'flex',gap:'8px',marginTop:'10px',flexWrap:'wrap',alignItems:'end'}} onSubmit=${e=>{e.preventDefault();const v=(d[r.id]||'').trim();if(v)reply(r.id,v)}}><input className="field" aria-label=${'Reply to '+r.client} placeholder="Write a reply" value=${d[r.id]||''} onInput=${e=>setD({...d,[r.id]:e.target.value})} style=${{flex:'1 1 16em',width:'auto'}}/><button className="btn sm">Send reply</button></form>`}</li>`)}</ul></section>`;
}

/* ================= app shell ================= */
const NAV={client:[['home','Home','home','Upload your portfolio'],['market','Market view','chart','What the market uses'],['portfolio','Portfolio','box','Your products and oils'],['oils','Our oils','drop','Catalog and scent'],['ideas','Ask us','idea','Samples and new oils']],staff:[['attention','Needs attention','bell','Your to-do list'],['clients','Clients','users','Brands and settings'],['featured','Featured oils','star','What to push'],['requests','Requests','inbox','Reply to clients']]};
const stamp=()=>{const d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toTimeString().slice(0,5)};
const REQ0=[{id:1,client:'Nimbus Hygiene',title:'Sample of a fresher oil for our sport deodorant',cat:'Deodorant',qty:'60,000',status:'Waiting for reply',reply:''},{id:2,client:'Verde Home & Body',title:'Coconut oil with longer-lasting base for soap',cat:'Soap',qty:'200,000',status:'Waiting for reply',reply:''}];
const ATT0=[{id:'a1',kind:'Request',who:'Nimbus Hygiene',text:'Asked for a sample of a fresher oil for their sport deodorant.',why:'Every new client request appears here.',go:'requests'},{id:'a2',kind:'Account',who:'Coastline Cosmetics',text:`No ${CUR} portfolio uploaded yet.`,why:'Shown when a quarter ends without an upload.',go:'clients'},{id:'a3',kind:'Request',who:'Verde Home & Body',text:'Asked for a coconut oil with a longer-lasting base for soap.',why:'Every new client request appears here.',go:'requests'}];
const CL0={aurel:{last:'2 Oct 2026',ourSales:false,ai:false},nimbus:{last:'4 Oct 2026',ourSales:true,ai:false},verde:{last:'1 Oct 2026',ourSales:false,ai:false},coast:{last:'3 Jul 2026',ourSales:false,ai:false}};
function App(){
  const[role,setRole]=useState('client'),[page,setPage]=useState('home');
  const[products,setProducts]=useState(P0),[uploads,setUploads]=useState([{name:'aurel-portfolio-q3.csv',rows:4,when:'2 Oct 2026'}]),[feat,setFeatAll]=useState(FEAT0);
  const[requests,setRequests]=useState(REQ0),[att,setAtt]=useState(ATT0),[clients,setClients]=useState(CL0),[audit,setAudit]=useState([['20 Nov 2026 10:05','staff@manufacturer (sample)','Featured CS-110 Lavender Field as "Ready stock"']]);
  const[toast,setToast]=useState(null);const tm=useRef();
  const say=(text,undo)=>{setToast({text,undo});clearTimeout(tm.current);tm.current=setTimeout(()=>setToast(null),5000)};
  const log=(who,w)=>setAudit(a=>[[stamp(),who,w],...a]);
  const switchRole=r=>{setRole(r);setPage(NAV[r][0][0]);window.scrollTo(0,0)};const go=p=>{setPage(p);window.scrollTo(0,0)};
  const addRequest=r=>{const id=Date.now();setRequests(q=>[{id,client:BRANDS[ME],status:'Waiting for reply',reply:'',...r},...q]);setAtt(a=>[{id:'a'+id,kind:'Request',who:BRANDS[ME],text:'Asked: '+r.title+'.',why:'Every new client request appears here.',go:'requests'},...a]);say('Request sent. Our team will reply in "Ask us".')};
  const onSaved=(name,rows)=>{setProducts(ps=>{const out=ps.map(p=>({...p,units:{...p.units}}));rows.forEach(r=>{const ex=out.find(p=>p.brand===ME&&p.name===r.name);if(ex){Object.assign(ex,{cat:r.cat,oil:r.oil,market:r.market,launch:r.launch});ex.units[r.period]=r.units}else out.push({brand:ME,name:r.name,cat:r.cat,oil:r.oil,market:r.market,launch:r.launch,units:{[r.period]:r.units}})});return out});setUploads(u=>[{name,rows:rows.length,when:'Today'},...u]);setClients(c=>({...c,[ME]:{...c[ME],last:'Today'}}))};
  let view;
  if(page==='home')view=html`<${Home} products=${products} uploads=${uploads} feat=${feat} onSaved=${onSaved} go=${go}/>`;
  else if(page==='market')view=html`<${Market} products=${products} feat=${feat} ask=${(code,cat)=>addRequest({title:`Sample of ${code} ${OILS[code].name}`+(cat?` for our ${cat.toLowerCase()}`:''),cat:cat||'Deodorant',qty:'—'})}/>`;
  else if(page==='portfolio')view=html`<${Portfolio} products=${products} useOurSales=${clients[ME].ourSales} setUseOurSales=${v=>{setClients(c=>({...c,[ME]:{...c[ME],ourSales:v}}));log('client@aurel (sample)',`${v?'Allowed':'Stopped'} use of oil sales records to fill in volumes`);say(v?'Saved. We may now fill in your volumes from our sales records.':'Saved. We will only use the numbers you upload.')}}/>`;
  else if(page==='oils')view=html`<${Oils} feat=${feat} products=${products}/>`;
  else if(page==='ideas')view=html`<${Ideas} requests=${requests} addRequest=${addRequest}/>`;
  else if(page==='attention')view=html`<${Attention} items=${att} go=${go} done=${id=>{const i=att.findIndex(a=>a.id===id),it=att[i];setAtt(a=>a.filter(x=>x.id!==id));say('Marked done.',()=>setAtt(a=>{const n=[...a];n.splice(i,0,it);return n}))}}/>`;
  else if(page==='clients')view=html`<${Clients} products=${products} uploads=${uploads} clients=${clients} audit=${audit} toggle=${(id,k)=>{const v=!clients[id][k];setClients(c=>({...c,[id]:{...c[id],[k]:v}}));log('staff@manufacturer (sample)',`Turned ${v?'on':'off'} AI column matching for ${BRANDS[id]}`)}}/>`;
  else if(page==='featured')view=html`<${Featured} feat=${feat} products=${products} setFeat=${(c,v)=>{setFeatAll(f=>{const n={...f};if(v)n[c]=v;else delete n[c];return n});log('staff@manufacturer (sample)',v?`Featured ${c} ${OILS[c].name} as "${v}"`:`Stopped featuring ${c} ${OILS[c].name}`);say(v?`${OILS[c].name} is now featured to all clients.`:`${OILS[c].name} is no longer featured.`)}}/>`;
  else view=html`<${Requests} requests=${requests} reply=${(id,text)=>{const r=requests.find(x=>x.id===id);setRequests(q=>q.map(x=>x.id===id?{...x,reply:text,status:'Answered'}:x));setAtt(a=>a.filter(x=>!(x.kind==='Request'&&x.who===r.client)));log('staff@manufacturer (sample)',`Replied to "${r.title}" from ${r.client}`);say('Reply sent.')}}/>`;
  const nav=NAV[role];
  return html`<div className="app"><aside><div className="brand">Client Studio<small>Prototype · all data is sample</small></div>
    <div className="who" role="group" aria-label="View as"><button id="r-client" aria-pressed=${role==='client'} onClick=${()=>switchRole('client')}>Client: Aurel Personal Care</button><button id="r-staff" aria-pressed=${role==='staff'} onClick=${()=>switchRole('staff')}>Our team</button></div>
    <nav className="nav" aria-label="Sections">${nav.map(([k,l,ic,hint])=>html`<button key=${k} data-tab=${k} aria-current=${page===k?'page':undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/><span>${l}<br/><span className="sub">${hint}</span></span>${k==='attention'&&att.length>0&&html`<span className="count">${att.length}</span>`}</button>`)}</nav>
    <div className="foot">Prototype for review. Four sample brands. Changes reset when you reload.</div></aside>
   <main>${view}</main>
   <nav className="tabbar" aria-label="Sections">${nav.map(([k,l,ic])=>html`<button key=${k} data-mtab=${k} aria-current=${page===k?'page':undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/>${({'Market view':'Market','Our oils':'Oils','Needs attention':'To do','Featured oils':'Featured'})[l]||l}</button>`)}</nav>
   ${toast&&html`<div className="toast" role="status">${toast.text}${toast.undo&&html`<button onClick=${()=>{toast.undo();setToast(null)}}>Undo</button>`}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>

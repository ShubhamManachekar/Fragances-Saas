function WorldMap({byReg,mapStyle}){
  const[ref,{w:W,h:H}]=useSize();const LBL={'United Kingdom':'nw','Europe':'ne','GCC':'w','India':'e','Southeast Asia':'e','North America':'n'};
  let body=null;if(W){const k=Math.min(W/360,H/136),ox=(W-360*k)/2,oy=(H-136*k)/2,X=lo=>ox+(lo+180)*k,Y=la=>oy+(80-la)*k,holo=mapStyle==='hologram',mx=Math.max(...Object.values(byReg)),r0=Math.max(12,k*15),dr=Math.max(1,k*.75);
    const pts=Object.entries(byReg).map(([nm,v])=>{const[la,lo]=REGIONS[nm];return{nm,v,x:X(lo),y:Y(la),r:Math.max(5,Math.sqrt(v/mx)*r0)}});
    const short=nm=>W<520?({'United Kingdom':'UK','Southeast Asia':'SE Asia','North America':'N. America'}[nm]||nm):nm;
    body=html`<svg viewBox=${`0 0 ${W} ${H}`}>${DOTS.map(([lo,la],i)=>html`<circle key=${i} cx=${X(lo)} cy=${Y(la)} r=${dr} fill=${holo?'none':'var(--dot)'} stroke=${holo?'var(--gold)':'none'} stroke-opacity=".55"/>`)}
      ${pts.map(p=>holo?html`<g key=${p.nm}><circle cx=${p.x} cy=${p.y} r=${p.r} fill="none" stroke="var(--wine)" stroke-width="1.5"/><circle cx=${p.x} cy=${p.y} r=${p.r*.55} fill="none" stroke="var(--wine)" stroke-opacity=".5"/><circle cx=${p.x} cy=${p.y} r="2.5" fill="var(--wine)"/></g>`:html`<circle key=${p.nm} cx=${p.x} cy=${p.y} r=${p.r} fill="var(--wine)" fill-opacity=".8" stroke="var(--surface)"/>`)}
      ${pts.map(({nm,v,x,y,r})=>{const d=LBL[nm];const[a,tx,ty]=d==='nw'?['end',x-r*.6,y-r-4]:d==='w'?['end',x-r-5,y+4]:d==='e'?['start',x+r+5,y+4]:d==='ne'?['start',x+r*.7+3,y-r*.7-3]:['middle',x,y-r-6];
        return html`<text key=${'t'+nm} x=${tx} y=${ty} text-anchor=${a} font-size="13" fill="var(--ink)" style=${{paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'}}>${short(nm)} ${money(v)}</text>`})}</svg>`}
  return html`<div className="fig" ref=${ref} role="img" aria-label="World map of revenue by market">${body}</div>`;
}

/* ---------------- client: perfumes (scent over time) ---------------- */
const PH=[['top','Top notes','First impression','0 – 30 min','var(--gold)'],['heart','Heart notes','The main character','30 min – 4 h','var(--wine)'],['base','Base notes','What stays on skin','4 h and longer','var(--base)']];
const curve={top:t=>Math.exp(-t/.4),heart:t=>{const p=1.3;return Math.pow(t/p,1.6)*Math.exp(1.6*(1-t/p))},base:t=>.85*(1-Math.exp(-t/1.6))*Math.exp(-t/30)};
const TMAX=8,TT=[0,.25,.5,1,2,4,6,8],tl=t=>t===0?'Spray':t<1?Math.round(t*60)+' min':t+' h';
function ScentChart({name,t}){
  const[ref,{w:W,h:H}]=useSize();let body=null;
  if(W){const m={l:8,r:8,t:30,b:30},X=v=>m.l+Math.sqrt(v/TMAX)*(W-m.l-m.r),Y=v=>H-m.b-v*(H-m.t-m.b);
    const path=f=>{let d=`M${X(0)},${Y(0)}`;for(let i=0;i<=120;i++){const v=TMAX*(i/120)**2;d+=`L${X(v)},${Y(Math.min(1,f(v)))}`}return d+`L${X(TMAX)},${Y(0)}Z`};
    body=html`<svg viewBox=${`0 0 ${W} ${H}`}>${TT.map(v=>html`<g key=${v}><line x1=${X(v)} x2=${X(v)} y1=${m.t} y2=${H-m.b} stroke="var(--line)"/><text x=${X(v)} y=${H-8} font-size="13" fill="var(--muted)" text-anchor=${v===0?'start':v===TMAX?'end':'middle'}>${W<480&&(v===.25||v===6)?'':tl(v)}</text></g>`)}
      ${PH.map(([k,,,,c])=>html`<path key=${k} d=${path(curve[k])} fill=${c} fill-opacity=".2" stroke=${c} stroke-width="2"/>`)}
      <text x=${X(.02)+6} y=${Y(1)-10} font-size="14" font-weight="500" fill="var(--gold)" style=${{paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'}}>${W<520?'Top':'Top notes'}</text>
      <text x=${X(1.3)} y=${Y(1)-10} font-size="14" font-weight="500" fill="var(--wine)" text-anchor="middle" style=${{paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'}}>${W<520?'Heart':'Heart notes'}</text>
      <text x=${X(TMAX)-6} y=${Y(curve.base(TMAX))-10} font-size="14" font-weight="500" fill="var(--base)" text-anchor="end" style=${{paintOrder:'stroke',stroke:'var(--surface)',strokeWidth:'4px'}}>${W<520?'Base':'Base notes'}</text>
      <line x1=${X(t)} x2=${X(t)} y1=${m.t-14} y2=${H-m.b} stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`}
  return html`<div className="chart" ref=${ref} role="img" aria-label=${'How '+name+' smells over time: top notes fade within about 30 minutes, heart notes lead for a few hours, base notes last longest.'}>${body}</div>`;
}

  const switchRole=r=>{setRole(r);setPage(NAV[r][0][0]);window.scrollTo(0,0)};const go=p=>{setPage(p);window.scrollTo(0,0)};
  let view;
  if(page==='home')view=html`<${Home} uploads=${uploads} go=${go} onSaved=${(name,rows)=>{setSales(s=>[...s,...rows]);setUploads(u=>[{name,rows:rows.length,when:'Today'},...u])}}/>`;
  else if(page==='insights')view=html`<${Insights} sales=${sales} go=${go}/>`;
  else if(page==='perfumes')view=html`<${Perfumes}/>`;
  else if(page==='ideas')view=html`<${Ideas} requests=${requests} addRequest=${r=>{const id=Date.now();setRequests(q=>[{id,client:'Maison Aurel',status:'Waiting for reply',reply:'',...r},...q]);setAtt(a=>[{id:'a'+id,kind:'Request',who:'Maison Aurel',text:'Asked for a new idea: '+r.title+'.',why:'Every new client request appears here.',go:'requests'},...a]);say('Request sent. Our team will reply here.')}}/>`;
  else if(page==='attention')view=html`<${Attention} items=${att} go=${go} done=${id=>{const i=att.findIndex(a=>a.id===id),it=att[i];setAtt(a=>a.filter(x=>x.id!==id));say('Marked done.',()=>setAtt(a=>{const n=[...a];n.splice(i,0,it);return n}))}}/>`;
  else if(page==='clients')view=html`<${Clients} clients=${clients} audit=${audit} toggle=${(i,k)=>{const c=clients[i],v=!c[k];setClients(cs=>cs.map((x,j)=>j===i?{...x,[k]:v}:x));log(`Turned ${v?'on':'off'} "${k==='ai'?'AI column matching':'Shared insights'}" for ${c.name}`)}}/>`;
  else view=html`<${Requests} requests=${requests} reply=${(id,text)=>{const r=requests.find(x=>x.id===id);setRequests(q=>q.map(x=>x.id===id?{...x,reply:text,status:'Answered'}:x));setAtt(a=>a.filter(x=>!(x.kind==='Request'&&x.text.includes(r.title))));log(`Replied to "${r.title}" from ${r.client}`);say('Reply sent.')}}/>`;
  const nav=NAV[role];
  return html`<div className="app"><aside><div className="brand">Client Studio<small>Prototype · all data is sample</small></div>
    <div className="who" role="group" aria-label="View as"><button id="r-client" aria-pressed=${role==='client'} onClick=${()=>switchRole('client')}>Client: Maison Aurel</button><button id="r-staff" aria-pressed=${role==='staff'} onClick=${()=>switchRole('staff')}>Manufacturer staff</button></div>
    <nav className="nav" aria-label="Sections">${nav.map(([k,l,ic,hint])=>html`<button key=${k} data-tab=${k} aria-current=${page===k?'page':undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/><span>${l}<br/><span className="sub">${hint}</span></span>${k==='attention'&&att.length>0&&html`<span className="count">${att.length}</span>`}</button>`)}</nav>
    <div className="foot">Prototype for review. Changes stay in this page and reset when you reload.</div></aside>
   <main>${view}</main>
   <nav className="tabbar" aria-label="Sections">${nav.map(([k,l,ic])=>html`<button key=${k} data-mtab=${k} aria-current=${page===k?'page':undefined} onClick=${()=>go(k)}><${Icon} n=${ic}/>${l}</button>`)}</nav>
   ${toast&&html`<div className="toast" role="status">${toast.text}${toast.undo&&html`<button onClick=${()=>{toast.undo();setToast(null)}}>Undo</button>`}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
